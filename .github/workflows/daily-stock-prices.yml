name: daily-stock-prices

on:
  schedule:
    - cron: "30 18 * * 1-5"
      timezone: "Asia/Tokyo"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "再取得する暦日数（今回の初回バックフィルは21）"
        required: true
        default: "7"

concurrency:
  group: daily-stock-prices
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependency
        run: python -m pip install "xlrd==2.0.2"

      - name: Collect all current TSE domestic stocks
        env:
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '7' }}
        run: |
          python scripts/collect_daily_prices.py \
            --lookback-days "$LOOKBACK_DAYS" \
            --output-dir data/daily-prices \
            --summary-output .cache/daily-price-summary.json

      - name: Write job summary
        run: |
          {
            echo '## 日次株価収集'
            echo '```json'
            cat .cache/daily-price-summary.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update data pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.PR_TOKEN || github.token }}
          branch: automation/daily-stock-prices
          delete-branch: true
          commit-message: "data: update daily Japanese stock prices"
          title: "data: 日本株の日次株価を更新"
          body: |
            JPXの現行内国株式一覧を母集団に、Yahoo Finance chart APIから
            日足OHLCVを取得した自動更新です。

            - 用途: 候補探索・欠損監視
            - 売買判断: JPX、会社IR、証券会社等の一次資料で再照合が必要
            - 取得失敗: `latest.json` とCSVの `取得状態` を確認
          add-paths: |
            data/daily-prices
